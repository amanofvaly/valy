# Production stack for TrueNAS.
#
# THIS FILE IS PRODUCTION. It is pulled and managed automatically by Portainer's 
# Git integration (Stack: valy-store). 
#
# To apply infrastructure changes, modify this file, commit, and push. Portainer 
# will automatically pull the changes and redeploy the stack. Do not use SSH 
# (`docker compose up`) to deploy this stack, as it will conflict with Portainer.
#
# Secrets stay out of git: they are set as stack environment variables in
# Portainer, not in this file.
#
# Host paths are absolute on purpose. Portainer clones this repo into its own
# directory, so a relative `./postgres-data` would resolve inside that clone —
# giving an empty database, no uploads, and a cloudflared with no credentials,
# while the real data sat untouched somewhere else.

services:
  postgres:
    image: postgres:15-alpine
    container_name: valy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - /mnt/Server-Storage/valy_backend/postgres-data:/var/lib/postgresql/data
    ports:
      # Reachable from the whole LAN, on the default credentials unless .env
      # overrides them. Anyone on the network can read the Shiprocket password.
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: valy-redis
    restart: always
    ports:
      - "6379:6379"

  medusa:
    image: ghcr.io/amanofvaly/valy-backend:latest
    container_name: valy-medusa
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"
    volumes:
      # Product images. Without this they live in the container's writable
      # layer and are thrown away every time the container is replaced, while
      # the database keeps pointing at them.
      - /mnt/Server-Storage/valy_backend/uploads:/app/apps/backend/.medusa/server/static
    environment:
      # Baked into every stored image URL by the local file provider.
      - BACKEND_URL=${BACKEND_URL:-https://api.valy.in}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - COOKIE_SECRET=${COOKIE_SECRET:-supersecret}
      - MEDUSA_ADMIN_ONBOARDING_TYPE=default
      - STORE_CORS=${STORE_CORS}
      - ADMIN_CORS=${ADMIN_CORS}
      - AUTH_CORS=${AUTH_CORS}
      # Readable timestamps in `docker logs`; the default is UTC.
      - TZ=${TZ:-Asia/Kolkata}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: valy-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - /mnt/Server-Storage/valy_backend/cloudflared:/etc/cloudflared
    depends_on:
      - medusa
    environment:
      - TZ=${TZ:-Asia/Kolkata}

  # Polls the registry and replaces valy-medusa when a new image is pushed.
  #
  # This is the third thing that can recreate a container, alongside compose and
  # Portainer. It is here because nothing else triggers a deploy; once CI can
  # redeploy the stack directly, this should be removed rather than kept as a
  # second mechanism doing the same job by a different route.
  watchtower:
    image: containrrr/watchtower
    container_name: valy-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 300 valy-medusa
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - WATCHTOWER_LOG_FORMAT=Pretty
